name: Build and Push Guestbook Image

on:
  push:
    branches: [main]
    paths:
      - apps/guestbook/**

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/guestbook

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/guestbook
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update image tag in kustomization.yaml
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s/newTag: .*/newTag: ${SHA}/" apps/guestbook/kustomization.yaml

      - name: Commit and push updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/guestbook/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: update image tag to ${{ github.sha }}"
          git push
