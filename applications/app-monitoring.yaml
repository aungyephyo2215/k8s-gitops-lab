apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops-lab
    app.kubernetes.io/component: app-monitoring
spec:
  project: gitops-lab

  source:
    repoURL: https://github.com/aungyephyo2215/k8s-gitops-lab.git
    targetRevision: main
    path: apps/monitoring/app-monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
