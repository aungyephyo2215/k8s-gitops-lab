apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: guestbook
  namespace: argocd
spec:
  imageRepositories:
    - image: ghcr.io/aungyephyo2215/guestbook
      updateStrategy: latest
      writeBackMethod: git
      writeBackTarget: kustomization
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: gitops-lab
    spec:
      source:
        repoURL: https://github.com/aungyephyo2215/k8s-gitops-lab.git
        targetRevision: main
        path: apps/guestbook
      destination:
        server: https://kubernetes.default.svc
        namespace: app-01
