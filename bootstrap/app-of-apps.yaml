apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops-lab
spec:
  project: gitops-lab

  source:
    repoURL: https://github.com/aungyephyo2215/k8s-gitops-lab.git
    targetRevision: main
    path: applications
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
