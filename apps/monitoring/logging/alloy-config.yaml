apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: monitoring-stack
data:
  config.alloy: |
    // Alloy configuration for log collection
    // Collects: pod logs (all namespaces) + journal logs

    // --- Pod Logs ---
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // --- Journal Logs ---
    local.file_match "journal" {
      path_targets = [{
        __path__ = "/var/log/journal",
      }]
    }

    loki.source.journal "journal" {
      forward_to = [loki.write.receiver.receiver]
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.kubernetes.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      // Extract namespace, pod, container labels
      stage.static_labels {
        values = {
          source = "kubernetes",
        }
      }

      // Parse docker/cri logs
      stage.docker { }

      // Forward to Loki
      forward_to = [loki.write.receiver.receiver]
    }

    loki.write "receiver" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
    }
